<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="card">
            <div class="arrows">
                <span class="arrow"><img src="img/left.png"></span>
                <span class="arrow"><img src="img/right.png"></span>
            </div>
            <div class="cloud"></div>
            <div class="temp">17</div>
        </div>

        <ul class="forecast">
            <li class="day"><span class="day-name">Mon</span>17°</li>
            <li class="day"><span class="day-name">Tue</span>19°</li>
            <li class="day"><span class="day-name">Wed</span>16°</li>
            <li class="day"><span class="day-name">Thu</span>18°</li>
            <li class="day"><span class="day-name">Fri</span>21°</li>
        </ul>
    </div>
</body>
</html>
